name: Monthly Einbürgerung Check

on:
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch:

permissions:
  contents: write   # ← YENİ: last_value.txt dosyasını geri commit'leyebilmek için gerekli

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Repo'yu çek
      uses: actions/checkout@v3

    - name: Python kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Gereksinimleri yükle
      run: pip install -r requirements.txt

    - name: Scraper'ı çalıştır
      working-directory: ${{ github.workspace }}
      run: python scraper.py
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}

    - name: Durumu commit'le           # ← YENİ ADIM
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add last_value.txt
        git diff --cached --quiet || git commit -m "Update last_value.txt"
        git push
